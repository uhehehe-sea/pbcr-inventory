<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>PBCR 자재 재고</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script>
/**
 * PBCR 현장 용어 검색 (field-search.js)
 * 재고 앱(index.html)에 붙이는 검색 모듈. 외부 라이브러리 없음.
 *
 * 사용법
 *   (index.html 안에 넣어 사용)
 *   const results = FieldSearch.search(items, '서스304 어디있어?');
 *   // results: [{ item, score }]  — 점수 높은 순
 *   // 결과가 0건이면 FieldSearch.onMiss(query) 가 호출됨 (기본: 아무것도 안 함 → 로그 기록용으로 교체 가능)
 *
 * items 형식: 재고 API 'items' 응답 그대로 (code, name, matNote, body, diaphragm, note, memo, order, location …)
 *
 * 사전 추가: FieldSearch.addTerms([['SUS', ['서스','스텐']], ...])  — 시트 '용어사전' 탭을 읽어 넣을 때 사용
 */
(function (global) {
  'use strict';

  /* ---------- 1. 용어사전: [검색 키워드(들), [현장 용어들]] ----------
     키워드에 '|' 를 쓰면 "이 중 아무거나" (예: 'PTFE|TEFLON')
     ※ 현장 분들 확인 전 초안. 근거: 업체·자재몰 표기 조사 + 재고 품명 */
  const TERMS = [
    // 재질
    ['SUS', ['서스', '스텐', '스뎅', '스테인리스', '스테인레스', 'STS']],
    ['PTFE|TEFLON', ['테프론', '테플론', '테프']],
    ['FPM|FKM|VITON', ['바이톤', '불소고무', '비톤']],
    ['EPDM', ['이피디엠', '에틸렌프로필렌']],
    ['PVDF', ['피브이디에프', '피비디에프', '불소수지']],
    ['PEEK', ['피크']],
    ['PP', ['피피', '폴리프로필렌']],
    ['PVC', ['피브이씨', '피비씨']],
    ['AFLAS', ['아플라스']],
    ['PFA', ['피에프에이']],
    // 배관 부속
    ['ELBOW', ['엘보우', '엘보', '엘보우관']],
    ['TEE', ['티이', '티자', '티']],
    ['REDUCER', ['레듀샤', '레듀서', '리듀서']],
    ['FLANGE', ['후렌지', '플랜지', '프랜지']],
    ['NIPPLE', ['니뿌루', '니플']],
    ['UNION', ['유니온', '유니언']],
    ['SOCKET', ['소켓', '소케또']],
    ['PRESSURE REDUCING VALVE', ['감압밸브', '감압변']],
    ['PRESSURE', ['압력']],
    ['GAUGE|GAGE', ['게이지', '압력계']],
    ['VALVE', ['밸브', '벨브', '발브']],
    ['PACKING|GASKET', ['빠킹', '패킹', '가스켓', '개스킷']],
    ['O-RING|ORING|O RING', ['오링', '오-링']],
    ['FITTING', ['피팅']],
    ['PIPE', ['파이프', '배관']],
    // 체결
    ['BOLT', ['볼트', '보루또']],
    ['NUT', ['너트', '나또']],
    ['WASHER', ['와샤', '와셔']],
    ['SCREW|BOLT', ['나사', '스크류']],
    ['HEX', ['육각']],
    ['WRENCH', ['렌치', '랜치']],
    ['HEADLESS', ['무두']],
    ['ROUND HEAD', ['둥근머리', '라운드헤드']],
    // 부품·장비
    ['GRIPPER', ['그리퍼', '그립퍼', '집게']],
    ['HOLDER', ['홀더', '고정대']],
    ['COVER', ['커버', '덮개']],
    ['SUPPORT', ['서포트', '받침']],
    ['LEVEL', ['레벨', '수위']],
    ['SENSOR', ['센서', '쎈서']],
    ['CONDUCTIVITY', ['전도도']],
    ['CABLE', ['케이블', '케불']],
    ['DRAIN', ['드레인', '배수']],
    ['NOZZLE', ['노즐']],
    ['PUMP', ['펌프', '뽐뿌']],
    ['HEATER', ['히터']],
    ['ROLLER', ['롤러', '로라']],
    ['HANDLE', ['핸들', '손잡이']],
    ['SHAFT', ['샤프트', '축']],
    ['BEARING', ['베어링', '베아링']],
    ['PIN', ['핀']],
    ['BLOCK', ['블럭', '블록']],
    ['BATH', ['배스', '수조']],
    ['SOLENOID', ['솔레노이드', '솔밸브']],
    ['O3 GENERATOR', ['오존발생기', '오존']],
    ['WELDING', ['용접기', '용접']],
    ['LOCK', ['락', '잠금']],
    ['RAIL', ['레일']],
    ['INNER', ['이너', '안쪽']],
    ['WHITE', ['흰색', '화이트']],
    ['GRAY|GREY', ['회색', '그레이']]
  ];

  // 검색어에서 빼는 말 (말하듯이 쳐도 되게)
  const FILLER = ['어디있어', '어디 있어', '어디있나', '어디있지', '어디에', '어디', '위치', '있어', '있나',
    '몇개', '몇 개', '찾아줘', '찾아', '알려줘', '보여줘', '재고', '좀', '요'];
  const JOSA = /(은|는|이|가|을|를|에|의|도|랑|하고)$/;

  let dict = [];   // [{ alias, alts:[...] }] — 긴 별칭 먼저
  function buildDict(list) {
    list.forEach(([key, aliases]) => {
      const alts = String(key).toUpperCase().split('|').map(s => s.trim()).filter(Boolean);
      aliases.forEach(a => dict.push({ alias: String(a).toUpperCase(), alts }));
    });
    dict.sort((a, b) => b.alias.length - a.alias.length);
  }
  buildDict(TERMS);

  /* ---------- 2. 정규화 ---------- */
  function norm(s) {
    return String(s || '')
      .normalize('NFKC')                 // 전각 → 반각
      .toUpperCase()
      .replace(/\bSTS\s*[-_]?\s*(?=\d{3})/g, 'SUS')            // KS 표기 STS304 → SUS304
      .replace(/\bSUS\s*[-_]?\s*(\d{3}L?)\b/g, 'SUS$1')         // SUS 304 / SUS-304 → SUS304
      .replace(/\bPP\s*[-_]\s*([HNW])\b/g, 'PP-$1')              // PP H → PP-H
      .replace(/\b(M\d{1,2})\s*[X*×]\s*(\d{1,3})\s*L?\b/g, '$1 $1*$2'); // M5*20L → M5 M5*20
  }

  // 품목 → 검색용 문자열 (품명 가중치를 위해 따로 보관)
  function hay(item) {
    const name = norm(item.name);
    const other = norm([item.matNote, item.body, item.diaphragm, item.note, item.memo, item.order].join(' '));
    // 한글명·현장명 열(있으면): 품명과 같은 가중치
    const ko = norm([item.ko, item.koName, item.krName, item.alias, item.aliases, item['한글명'], item['현장명']].filter(Boolean).join(' '));
    return { name: name + (ko ? ' ' + ko : ''), other, code: String(item.code || '').toUpperCase() };
  }

  /* ---------- 3. 검색어 → 조건 목록 ---------- */
  // 결과: [{ alts:[...], raw }]  — 모든 조건을 만족(AND), 각 조건은 alts 중 하나(OR)
  function parse(query) {
    let q = String(query || '').normalize('NFKC').toUpperCase().replace(/[?!.,~]/g, ' ');
    FILLER.forEach(f => { q = q.split(f.toUpperCase()).join(' '); });

    // 사전 치환: 현장 용어 → {키워드|키워드}
    const groups = [];
    dict.forEach(({ alias, alts }) => {
      if (!/[가-힣]/.test(alias) && alias.length <= 3) {
        // 짧은 영문 별칭(STS 등)은 단어 경계에서만
        const re = new RegExp('\\b' + alias + '(?=\\d|\\b)', 'g');
        q = q.replace(re, () => ' §' + (groups.push(alts) - 1) + '§ ');
      } else {
        q = q.split(alias).join(' §' + groups.length + '§ ');
        // 한글 별칭 자체도 후보에 남김 → 시트의 '한글명/현장명' 열과도 맞춰봄
        if (q.indexOf('§' + groups.length + '§') >= 0) groups.push(/[가-힣]/.test(alias) ? alts.concat([alias]) : alts);
      }
    });

    // 그룹 + 바로 뒤 숫자 등급 붙이기: "§0§ 304" (서스304) → SUS304
    q = q.replace(/§(\d+)§\s*[-_]?\s*(\d{3}L?)\b/g, (m, g, n) => {
      const alts = groups[g];
      return alts.indexOf('SUS') >= 0 ? ' SUS' + n + ' ' : m;
    });
    q = norm(q.replace(/§(\d+)§/g, (m, g) => ' {#' + g + '} '));

    const terms = [];
    q.split(/\s+/).filter(Boolean).forEach(tok => {
      const g = tok.match(/^\{#(\d+)\}$/);
      if (g) { terms.push({ alts: groups[g[1]], raw: groups[g[1]].join('|') }); return; }
      tok = tok.replace(/^[^\w가-힣*-]+|[^\w가-힣*-]+$/g, '');
      if (/[가-힣]/.test(tok)) tok = tok.replace(JOSA, '');
      if (!tok) return;
      terms.push({ alts: [tok], raw: tok });
    });
    return terms;
  }

  /* ---------- 4. 한 조건이 품목에 맞는지 ---------- */
  function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function matchAlt(alt, h) {
    const text = h.name + ' ' + h.other;
    // 4자리 숫자만 → 코드 뒤 4자리
    if (/^\d{4}$/.test(alt)) return h.code.endsWith(alt) ? 3 : 0;
    // 전체 코드
    if (/^[A-Z]{2}\d{8}$/.test(alt)) return h.code === alt ? 5 : 0;
    // 재질 등급 (SUS304 → SUS304, SUS304L 은 매칭 / SUS316 은 제외)
    if (/^SUS\d{3}L?$/.test(alt)) {
      const re = new RegExp('\\b' + alt + '(?!\\d)');
      return re.test(h.name) ? 2 : re.test(h.other) ? 1 : 0;
    }
    // SUS 단독 → SUS, SUS304, SUS316 … 전부
    if (alt === 'SUS') {
      const re = /\bSUS(\d{3}L?)?\b/;
      return re.test(h.name) ? 2 : re.test(h.other) ? 1 : 0;
    }
    // 숫자만(4자리 아님) → 단독 숫자로만 (예: 304 가 800047304 에 걸리지 않게)
    if (/^\d+$/.test(alt)) {
      const re = new RegExp('(^|[^\\d])' + alt + '(?!\\d)');
      return re.test(h.name) ? 2 : re.test(h.other) ? 1 : 0;
    }
    // 볼트 규격 M5 → M5 (M50 제외)
    if (/^M\d{1,2}(\*\d+)?$/.test(alt)) {
      const re = new RegExp('\\b' + esc(alt) + '(?![\\d])');
      return re.test(h.name) ? 2 : re.test(h.other) ? 1 : 0;
    }
    // 짧은 영문(3자 이하: TEE, PIN, NUT, PP …) → 단어 시작 경계
    if (/^[A-Z0-9-]{1,3}$/.test(alt)) {
      const re = new RegExp('(^|[^A-Z])' + esc(alt) + '(?![A-Z])');
      return re.test(h.name) ? 2 : re.test(h.other) ? 1 : 0;
    }
    // 그 외(긴 영문·한글·구문) → 포함 여부
    return h.name.indexOf(alt) >= 0 ? 2 : text.indexOf(alt) >= 0 ? 1 : 0;
  }

  /* ---------- 5. 검색 ---------- */
  function search(items, query) {
    const terms = parse(query);
    if (!terms.length) return [];
    const out = [];
    (items || []).forEach(item => {
      const h = hay(item);
      let score = 0;
      for (const t of terms) {
        let best = 0;
        for (const a of t.alts) best = Math.max(best, matchAlt(a, h));
        if (!best) return;          // 모든 조건을 만족해야 함
        score += best;
      }
      if (Number(item.qty) > 0) score += 0.5; // 재고 있는 품목 먼저
      out.push({ item, score });
    });
    out.sort((a, b) => b.score - a.score);
    if (!out.length) FieldSearch.onMiss(query, terms);
    return out;
  }

  const FieldSearch = {
    search,
    parse,                                   // 디버깅용: FieldSearch.parse('서스304 어디있어')
    addTerms(list) { buildDict(list); },     // 시트 '용어사전' 탭 내용 추가
    onMiss() {},                             // 0건 검색어 기록용으로 교체
    TERMS
  };
  global.FieldSearch = FieldSearch;
  if (typeof module !== 'undefined') module.exports = FieldSearch;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<style>
  :root {
    --concrete: #E4E6E1; --surface: #F7F8F5; --ink: #1D2422; --muted: #66706C; --line: #C9CEC8;
    --head: #1D2422; --head-text: #fff; --head-sub: #C9D2CE; --field: #fff;
    --tag: #F2C230; --tag-ink: #1D2422; --steel: #2F5D7C; --in: #2E7D4F; --out: #B3412E;
    --sans: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --num: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --concrete: #151a19; --surface: #1f2624; --ink: #E6EAE8; --muted: #93A09B; --line: #34403C;
      --head: #0f1312; --head-sub: #93A09B; --field: #2a3331; --steel: #5B8DB0; --in: #4FA872; --out: #D9654F;
    }
  }
  :root[data-theme="dark"] {
    --concrete: #151a19; --surface: #1f2624; --ink: #E6EAE8; --muted: #93A09B; --line: #34403C;
    --head: #0f1312; --head-sub: #93A09B; --field: #2a3331; --steel: #5B8DB0; --in: #4FA872; --out: #D9654F;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: var(--concrete); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.45; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--steel); outline-offset: 2px; }

  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--head); color: var(--head-text); padding: 12px 16px; }
  .bar { max-width: 760px; margin: 0 auto; display: grid; gap: 10px; }
  .row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 1.15rem; font-weight: 700; }
  .who { font-size: .85rem; color: var(--head-sub); text-align: right; }
  #search { width: 100%; padding: 10px 12px; border-radius: 6px; border: none; background: #fff; color: #1D2422; font-size: 1.05rem; }

  main { max-width: 760px; margin: 0 auto; padding: 12px 12px 96px; }
  .meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; color: var(--muted); font-size: .85rem; padding: 4px 4px 10px; }
  .meta button { background: none; border: none; color: var(--steel); text-decoration: underline; cursor: pointer; padding: 0; margin-left: 12px; }
  .meta button:disabled { opacity: .5; cursor: default; }

  .item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px; }
  .item:first-child { border-radius: 8px 8px 0 0; }
  .item:last-child { border-radius: 0 0 8px 8px; border-bottom: none; }
  .item:only-child { border-radius: 8px; }
  .loc { min-width: 64px; padding: 6px 8px; text-align: center; background: var(--tag); color: var(--tag-ink); font-family: var(--num); font-weight: 700; font-size: 1.3rem; line-height: 1; border-left: 4px solid #1D2422; overflow-wrap: anywhere; max-width: 96px; cursor: pointer; }
  .loc.none { background: transparent; border: 2px dashed var(--line); color: var(--muted); font-size: 1rem; }
  .locedit { width: 88px; font: inherit; text-align: center; border: 2px solid #1D2422; border-radius: 6px; padding: 2px 4px; }
  .info { min-width: 0; cursor: pointer; }
  .code { font-family: var(--num); font-weight: 600; font-size: 1rem; color: var(--muted); letter-spacing: .02em; line-height: 1.1; }
  .code b { font-weight: 700; font-size: 1.6rem; color: var(--ink); }
  .name { font-weight: 500; overflow-wrap: anywhere; }
  .koname { font-size: 1rem; color: var(--ink); font-weight: 700; overflow-wrap: anywhere; line-height: 1.3; }
  .name.en { font-size: .8rem; font-weight: 400; color: var(--muted); line-height: 1.3; }
  .sub { color: var(--muted); font-size: .8rem; overflow-wrap: anywhere; }
  .sub .multi { color: var(--steel); font-weight: 500; }
  .sub .flag { color: var(--out); }
  .qty { font-family: var(--num); font-weight: 700; font-size: 2rem; line-height: 1; text-align: right; min-width: 56px; cursor: pointer; }
  .qty small { display: block; font-family: var(--sans); font-weight: 400; font-size: .72rem; color: var(--muted); }
  .qty.zero { color: var(--out); }
  .qty .recv { display: block; font-family: var(--sans); font-weight: 400; font-size: .8rem; color: var(--muted); }
  .pbar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 4px; overflow: hidden; }
  .pbar i { display: block; height: 100%; background: var(--in); border-radius: 2px; }
  .status { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-top: 4px; }
  .status.sealed { background: var(--in); color: #fff; }
  .status.opened { background: var(--steel); color: #fff; }
  .status.empty { background: var(--out); color: #fff; }
  .lastout { font-size: .78rem; color: var(--muted); margin-top: 2px; }
  .quickbtns { display: flex; gap: 6px; width: 100%; }
  .quickbtns button { flex: 1; height: 40px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-weight: 700; cursor: pointer; }
  .quickbtns button:active { background: var(--line); }

  .edit { grid-column: 1 / -1; display: none; gap: 8px; align-items: center; padding-top: 4px; flex-wrap: wrap; }
  .item.open .edit { display: flex; }
  .step { width: 48px; height: 48px; border-radius: 6px; border: none; font-size: 1.5rem; font-weight: 700; color: #fff; cursor: pointer; }
  .step.minus { background: var(--out); } .step.plus { background: var(--in); }
  .delta { width: 72px; height: 48px; text-align: center; border: 2px solid var(--line); border-radius: 6px; font-family: var(--num); font-size: 1.5rem; font-weight: 700; background: var(--field); }
  .delta.neg { color: var(--out); border-color: var(--out); } .delta.pos { color: var(--in); border-color: var(--in); }
  .note { flex: 1 1 140px; height: 48px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--field); }
  .confirm { height: 48px; padding: 0 18px; border: none; border-radius: 6px; background: var(--steel); color: #fff; font-weight: 700; cursor: pointer; }
  .confirm:disabled { opacity: .45; cursor: not-allowed; }
  .preview { width: 100%; font-size: .85rem; color: var(--muted); }
  .readonly .edit { display: none !important; }
  .uselabel { width: 100%; font-size: .85rem; font-weight: 700; color: var(--ink); margin-bottom: -2px; }
  .delta.use { color: var(--out); border-color: var(--out); }
  .histbtn { height: 40px; padding: 0 14px; border: 1px solid var(--steel); border-radius: 6px; background: var(--surface); color: var(--steel); font-weight: 700; cursor: pointer; }
  .histbtn[aria-pressed="true"] { background: var(--steel); color: #fff; }
  #histModal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 60; padding: 16px; }
  #histModal[hidden] { display: none; }
  #histModal .modal-box { background: var(--surface); color: var(--ink); max-width: 460px; padding: 0; display: flex; flex-direction: column; }
  .hist-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; }
  .hist-head .row { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
  .hist-head h2 { margin: 0; font-size: 1.05rem; }
  .hist-head .x { border: none; background: none; font-size: 1.2rem; color: var(--muted); cursor: pointer; padding: 0 4px; }
  .hist-head .en { font-size: .8rem; color: var(--muted); }
  .hist-sum { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .hist-sum div { flex: 1; background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .hist-sum b { display: block; font-family: var(--num); font-size: 1.5rem; line-height: 1.1; }
  .hist-sum span { font-size: .75rem; color: var(--muted); }
  .hist-list { overflow-y: auto; max-height: 55vh; }
  .hrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: .9rem; }
  .hrow .t { color: var(--muted); font-size: .8rem; }
  .hrow .c { font-family: var(--num); font-weight: 700; font-size: 1.2rem; text-align: right; grid-row: span 2; align-self: center; }
  .hrow .c.neg { color: var(--out); } .hrow .c.pos { color: var(--in); }
  .hrow .n { color: var(--muted); font-size: .8rem; grid-column: 1; }
  .hist-foot { padding: 10px 16px; }
  .hist-foot button { width: 100%; height: 42px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; font-weight: 700; }

  .batchHead { display: flex; align-items: baseline; gap: 10px; margin: 18px 2px 6px; padding-bottom: 4px; border-bottom: 2px solid var(--ink); }
  .batchHead:first-child { margin-top: 4px; }
  .batchHead b { font-family: var(--num); font-size: 1.35rem; font-weight: 600; }
  .batchHead span { color: var(--muted); font-size: .85rem; }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; background: var(--surface); border-radius: 8px; }
  #logs { display: none; position: fixed; right: 16px; top: 76px; width: min(360px, calc(100vw - 32px)); max-height: calc(100dvh - 110px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 36px rgba(0,0,0,.22); z-index: 40; padding: 12px; }
  #logs.show { display: block; }
  #logs h2 { font-size: 1rem; margin: 0 4px 8px; display: flex; justify-content: space-between; align-items: center; }
  #logs h2 button { border: none; background: none; font-size: 1.1rem; cursor: pointer; color: var(--muted); padding: 2px 8px; }
  .log { display: grid; grid-template-columns: 84px 1fr auto; gap: 8px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); font-size: .88rem; }
  .log .chg { font-family: var(--num); font-weight: 700; font-size: 1.1rem; }
  .log .chg.neg { color: var(--out); } .log .chg.pos { color: var(--in); }
  .log .t { color: var(--muted); }

  #toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 160%); background: #1D2422; color: #fff; padding: 12px 18px; border-radius: 6px; max-width: 90vw; transition: transform .25s ease; z-index: 10; }
  #toast.show { transform: translate(-50%, 0); } #toast.err { background: #B3412E; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }

  #gate { max-width: 420px; margin: 40px auto; padding: 24px; background: var(--surface); border-radius: 8px; display: grid; gap: 14px; }
  #gate h2 { margin: 0; font-size: 1.1rem; }
  #gate p { margin: 0; color: var(--muted); font-size: .9rem; }
  #gate label { display: grid; gap: 6px; font-size: .9rem; }
  #gate input, #gate select { height: 48px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--field); font-size: 1.05rem; }
  #gate button { height: 48px; border: none; border-radius: 6px; background: var(--steel); color: #fff; font-weight: 700; cursor: pointer; }
  #gate button:disabled { opacity: .5; }
  #gate .err { color: var(--out); font-size: .9rem; min-height: 1.2em; }
  .who button { background: none; border: none; color: var(--head-sub); text-decoration: underline; cursor: pointer; padding: 0; margin-left: 6px; font-size: .85rem; }
  [hidden] { display: none !important; }
  .item { grid-template-columns: auto 52px 1fr auto; }
  .thumb { width: 52px; height: 52px; border-radius: 6px; background: var(--field); border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center; cursor: pointer; position: relative; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.none { border-style: dashed; color: var(--muted); font-size: .68rem; text-align: center; line-height: 1.2; }
  .thumb .tag { position: absolute; left: 0; right: 0; bottom: 0; font-size: .6rem; text-align: center; color: #fff; background: rgba(29,36,34,.72); line-height: 1.5; }
  .photo { width: 100%; display: none; gap: 6px; }
  .item.open .photo { display: grid; }
  .photo img { width: 100%; max-height: 320px; object-fit: contain; background: #fff; border: 1px solid var(--line); border-radius: 6px; }
  .photo .cap { font-size: .8rem; color: var(--muted); }
  .photo .cap b { color: var(--ink); font-weight: 500; }
  #sortSel { font-size: .85rem; padding: 6px 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--field); color: var(--ink); }
  .rowbtns { display: flex; gap: 6px; margin-top: 8px; }
  .rowbtns button { font-size: .8rem; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; }
  .rowbtns .danger { color: var(--out); border-color: var(--out); }
  #itemModal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
  #itemModal[hidden] { display: none; }
  .modal-box { background: var(--surface); color: var(--ink); border-radius: 10px; padding: 18px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
  .modal-box h2 { margin: 0 0 12px; font-size: 1.1rem; }
  .modal-box label { display: grid; gap: 4px; margin-bottom: 10px; font-size: .85rem; color: var(--muted); }
  .modal-box input { font-size: 1rem; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--field); color: var(--ink); }
  .modal-box .err { color: var(--out); font-size: .85rem; min-height: 1.2em; margin-bottom: 6px; }
  .modal-btns { display: flex; gap: 8px; }
  .modal-btns button { flex: 1; padding: 10px; font-size: 1rem; border: none; border-radius: 6px; background: var(--steel); color: #fff; font-weight: 700; cursor: pointer; }
  .modal-btns .ghost { background: none; border: 1px solid var(--line); color: var(--ink); }
  #galModal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
  #galModal[hidden] { display: none; }
  #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
  #gallery[hidden] { display: none; }
  .gcell { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: pointer; background: var(--field); }
  .gcell img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .gcell .gcode { font-size: .68rem; padding: 4px 6px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gal-box img { width: 100%; max-height: 50vh; object-fit: contain; background: #fff; border-radius: 6px; }
  .gal-info { margin: 10px 0; }
  .gal-info .code { font-weight: 600; }
  .gal-info .name { margin: 4px 0; }
  .loc-big { font-size: 1.2rem; font-weight: 700; margin: 8px 0; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="row1"><h1>PBCR 자재 재고</h1><span style="display:flex;gap:8px;align-items:center"><a href="receive.html" style="font-size:.85rem;color:#fff;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:6px;text-decoration:none">📦 입고</a><span class="who" id="who"></span></span></div>
    <input id="search" type="search" placeholder="코드 뒤 4자리, 이름, 또는 한글 (예: 서스304)" autocomplete="off" enterkeyhint="search" hidden>
  </div>
</header>

<section id="gate" hidden>
  <h2>이름을 입력하세요</h2>
  <p>수량을 바꾸면 이 이름으로 기록됩니다. 이 기기에 기억되니 처음 한 번만 입력하면 돼요.</p>
  <label>이름<input id="nameInput" autocomplete="off" maxlength="30" placeholder="예: 홍길동"></label>
  <div class="err" id="gateErr"></div>
  <button id="gateBtn">시작하기</button>
</section>

<main id="main" hidden>
  <div class="meta">
    <span id="count">불러오는 중…</span>
    <span><select id="sortSel" aria-label="정렬">
      <option value="default">기본순</option>
      <option value="name">이름순</option>
      <option value="location">보관장소순</option>
      <option value="batch">항차별</option>
      <option value="recent">최근 등록순</option>
      <option value="qtyDesc">수량 많은순</option>
      <option value="qtyAsc">수량 적은순</option>
    </select><button id="addBtn">＋ 새 품목</button><button id="galleryBtn">갤러리</button><button id="exportXlsx">엑셀 다운로드</button><button id="refresh">새로고침</button><button id="toggleLogs">최근 기록 보기</button></span>
  </div>
  <div id="list"></div>
  <div id="gallery" hidden></div>
  <section id="logs"><h2>최근 기록 <button id="closeLogs" aria-label="닫기">✕</button></h2><div id="logList"></div></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="imgFile" accept="image/*" hidden>

<div id="itemModal" hidden>
  <div class="modal-box">
    <h2 id="modalTitle">새 품목 등록</h2>
    <label>SEA-CODE*<input id="f_code" autocomplete="off"></label>
    <label>규격(이름)*<input id="f_name" autocomplete="off"></label>
    <label>한글명<input id="f_ko" autocomplete="off" placeholder="예: 둥근머리 볼트 M3×10 (PEEK)"></label>
    <label>현장명 (현장에서 부르는 이름, 검색용)<input id="f_alias" autocomplete="off"></label>
    <label>수량<input id="f_qty" type="number" inputmode="numeric" value="0"></label>
    <label>위치<input id="f_location" autocomplete="off" placeholder="예: 1-1"></label>
    <label>발주번호<input id="f_order" autocomplete="off"></label>
    <label>배치<input id="f_batch" autocomplete="off"></label>
    <label>Body 재질<input id="f_body" autocomplete="off"></label>
    <label>Diaphragm 재질<input id="f_diaphragm" autocomplete="off"></label>
    <label>재질/비고<input id="f_matNote" autocomplete="off"></label>
    <label>비고<input id="f_note" autocomplete="off"></label>
    <label>메모<input id="f_memo" autocomplete="off"></label>
    <div class="err" id="modalErr"></div>
    <div class="modal-btns"><button id="modalSave">저장</button><button id="modalCancel" class="ghost">취소</button></div>
  </div>
</div>

<div id="histModal" hidden role="dialog" aria-modal="true" aria-labelledby="histTitle">
  <div class="modal-box">
    <div class="hist-head">
      <div class="row"><h2 id="histTitle"></h2><button class="x" id="histX" aria-label="닫기">✕</button></div>
      <div class="en" id="histSub"></div>
    </div>
    <div class="hist-sum">
      <div><b id="histUsed">0</b><span>총 사용</span></div>
      <div><b id="histLeft">0</b><span>남은 수량</span></div>
      <div><b id="histCount">0</b><span>기록 건수</span></div>
    </div>
    <div class="hist-list" id="histList"></div>
    <div class="hist-foot"><button id="histClose">닫기</button></div>
  </div>
</div>

<div id="galModal" hidden>
  <div class="modal-box gal-box">
    <div class="gal-img"><img id="galImg" alt=""></div>
    <div class="gal-info">
      <div class="code" id="galCode"></div>
      <div class="name" id="galName"></div>
      <div class="loc-big">📍 <span id="galLoc"></span></div>
      <div class="sub" id="galQty"></div>
    </div>
    <div class="modal-btns"><button id="galClose" class="ghost">닫기</button></div>
  </div>
</div>

<script>
  /* ▼▼ 재고 API(Apps Script 웹 앱) 주소 ▼▼ */
  const API_URL = 'https://script.google.com/macros/s/AKfycbyQ1KO3FjXO27BBIFAvZqdtZlp-0ICYIYLjSgV6wBZz0uoReGzcHCNy5NyIDvqclA8/exec';
  /* ▲▲▲▲ */

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const store = {
    get: k => { try { return localStorage.getItem('pbcr_' + k) || ''; } catch (_) { return ''; } },
    set: (k, v) => { try { localStorage.setItem('pbcr_' + k, v); } catch (_) {} },
    del: k => { try { localStorage.removeItem('pbcr_' + k); } catch (_) {} }
  };

  let user = store.get('user');
  let items = [], logs = [], openId = null, busy = false;
  const deltas = {};  // rid -> 사용 개수 (양수). 저장할 때 -사용개수로 기록

  async function api(action, body) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action }, body || {}))
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '요청 실패');
    return data;
  }

  function toast(msg, isErr) {
    const t = $('#toast'); t.textContent = msg; t.className = 'show' + (isErr ? ' err' : '');
    clearTimeout(t._h); t._h = setTimeout(() => t.className = '', 2800);
  }

  /* ---------- 첫 진입: 이름 (자유 입력, 목록 선택 아님) ---------- */
  function showGate() {
    $('#gate').hidden = false; $('#main').hidden = true; $('#search').hidden = true;
    $('#gateErr').textContent = ''; $('#nameInput').value = ''; $('#nameInput').focus();
  }
  $('#gateBtn').addEventListener('click', () => {
    const n = $('#nameInput').value.trim();
    if (!n) { $('#gateErr').textContent = '이름을 입력하세요.'; return; }
    user = n; store.set('user', user); start();
  });
  $('#nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#gateBtn').click(); });

  function start() {
    $('#gate').hidden = true; $('#main').hidden = false; $('#search').hidden = false;
    $('#who').innerHTML = `작업자: ${esc(user)}<button id="logout">변경</button>`;
    $('#logout').onclick = () => { store.del('user'); user = ''; $('#who').textContent = ''; showGate(); };
    load();
  }

  async function load() {
    if (busy) return; busy = true;
    try { const d = await api('items'); items = d.items || []; logs = d.logs || []; render(); renderLogs(); }
    catch (e) { $('#count').textContent = ''; toast('불러오기 실패: ' + e.message, true); }
    busy = false;
  }
  // 다른 사람이 바꾼 수량을 반영: 앱으로 돌아올 때와 1분마다 (조작 중이 아닐 때만)
  document.addEventListener('visibilitychange', () => { if (!document.hidden && user && !openId) load(); });
  setInterval(() => { if (!document.hidden && user && !openId) load(); }, 60000);

  /* ---------- 검색과 화면 ---------- */
  const batchNo = b => { const m = String(b || '').match(/\d+/); return m ? Number(m[0]) : -1; };
  const last4 = c => String(c).replace(/\D/g, '').slice(-4);
  function matches(i, q) {
    if (!q) return true;
    if (/^\d{1,4}$/.test(q)) return last4(i.code).startsWith(q);
    return [i.code, i.name, i.ko, i.alias, i.location, i.order, i.batch].join(' ').toLowerCase().includes(q);
  }
  // 한글 검색: 한글명·현장명에 그대로 들어 있으면 먼저, 그다음 현장 용어 사전 검색 결과
  function koSearch(q) {
    const key = q.replace(/\s+/g, '');
    const direct = items.filter(i => [i.ko, i.alias].join(' ').replace(/\s+/g, '').includes(key));
    const fs = window.FieldSearch ? FieldSearch.search(items, q).map(r => r.item) : [];
    const seen = new Set(direct.map(i => i.rid));
    return direct.concat(fs.filter(i => !seen.has(i.rid)));
  }
  function codeHtml(code) {
    const m = String(code).match(/^(.*?)(\d{4})$/);
    return m ? `${esc(m[1])}<b>${esc(m[2])}</b>` : `<b>${esc(code)}</b>`;
  }

  // 이미지: 드라이브 파일 ID → 썸네일 주소 (첫 주소가 안 뜨면 대체 주소로)
  const imgUrl = (id, w) => 'https:' + '//drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + w;
  const imgAlt = (id, w) => 'https:' + '//lh3.googleusercontent.com/d/' + encodeURIComponent(id) + '=w' + w;
  const CONF = {
    '정확모델': ['정확', '같은 품번의 제품 사진'],
    '동일타입 대표': ['유사', '같은 시리즈 대표 사진, 사이즈·재질·옵션은 다를 수 있음'],
    '일반 대표이미지': ['참고', '표준품의 일반적인 모양, 참고용'],
    '실물사진': ['실물', '창고에서 찍은 실제 사진']
  };
  const confOf = c => CONF[c] || (c ? [c.slice(0, 2), c] : ['', '']);
  window.imgFallback = el => { if (!el.dataset.alt) { el.dataset.alt = 1; el.src = imgAlt(el.dataset.id, el.dataset.w); } else { el.closest('.thumb, .photo')?.classList.add('broken'); el.remove(); } };

  function render() {
    const rawQ = $('#search').value.trim();
    const q = rawQ.toLowerCase();
    let list;
    if (/[가-힣]/.test(rawQ)) {
      list = koSearch(rawQ);
    } else {
      list = items.filter(i => matches(i, q));
    }
    const sv = $('#sortSel').value;
    list.sort((a, b) => {
      switch (sv) {
        case 'name': return a.name.localeCompare(b.name, 'ko');
        case 'batch': return (batchNo(b.batch) - batchNo(a.batch)) || a.rid.localeCompare(b.rid);
        case 'location': return (a.location || '￮').localeCompare(b.location || '￮', 'ko');
        case 'recent': return (b.createdAt || '').localeCompare(a.createdAt || '');
        case 'qtyDesc': return b.qty - a.qty;
        case 'qtyAsc': return a.qty - b.qty;
        default: return a.rid.localeCompare(b.rid);
      }
    });
    if (/^\d{4}$/.test(q) && list.length === 1) openId = list[0].rid;
    $('#count').textContent = `품목 ${list.length}개` + (q ? ` / 전체 ${items.length}개` : '');
    if (!items.length) { $('#list').innerHTML = '<div class="empty">Items 시트에 품목을 추가하면 여기에 나타납니다.</div>'; return; }
    if (!list.length) { $('#list').innerHTML = '<div class="empty">일치하는 코드가 없습니다. 숫자를 다시 확인하거나 이름으로 찾아보세요.</div>'; return; }
    const byCode = {};
    items.forEach(i => (byCode[i.code] = byCode[i.code] || []).push(i));
    let prevBatch = null;
    $('#list').innerHTML = list.map(i => {
      let head = '';
      if (sv === 'batch' && i.batch !== prevBatch) {
        prevBatch = i.batch;
        const g = list.filter(x => x.batch === i.batch);
        const withRecv = g.filter(x => x.received !== null && x.received !== undefined);
        const sealed = withRecv.filter(x => x.qty === x.received).length;
        const opened = withRecv.filter(x => x.qty > 0 && x.qty < x.received).length;
        const empty = withRecv.filter(x => x.qty === 0).length;
        head = `<div class="batchHead"><b>${esc(i.batch ? batchNo(i.batch) + '차' : '항차 미기재')}</b><span>품목 ${g.length}개, 재고 ${g.reduce((a, x) => a + x.qty, 0)}개, 미개봉 ${sealed}, 개봉 ${opened}, 소진 ${empty}</span></div>`;
      }
      const d = deltas[i.rid] || 0, same = byCode[i.code] || [];

      const meta = [i.order, i.batch].filter(Boolean).join(', ');
      return head + `
      <div class="item ${openId === i.rid ? 'open' : ''}" data-id="${esc(i.rid)}">
        <div class="loc ${i.location ? '' : 'none'}" data-act="editloc" title="클릭해서 위치 수정">${esc(i.location || '미정')}</div>

          <div class="sub">${multi}${esc(meta)}${i.memo ? `<br><span class="${/실물 없음|확인 필요/.test(i.memo) ? 'flag' : ''}">${esc(i.memo)}</span>` : ''}${i.lastOut ? `<br><span class="lastout">최근 반출 ${esc(i.lastOut.time)} ${esc(i.lastOut.user)} ${i.lastOut.change}${i.lastOut.note ? ', ' + esc(i.lastOut.note) : ''}</span>` : ''}</div>
        </div>
        <div class="qty ${i.qty === 0 ? 'zero' : ''}" data-act="open">${i.qty}<small>개</small>${i.received !== null && i.received !== undefined ? `<span class="recv">/ ${i.received}</span><div class="pbar"><i style="width:${i.received > 0 ? Math.round(i.qty / i.received * 100) : 0}%"></i></div><span class="status ${i.qty === i.received ? 'sealed' : i.qty === 0 ? 'empty' : 'opened'}">${i.qty === i.received ? '미개봉' : i.qty === 0 ? '소진' : '개봉'}</span>` : ''}</div>
        <div class="edit">
          ${i.img ? `<div class="photo"><img loading="lazy" alt="${esc(i.name)}" data-id="${esc(i.img)}" data-w="800" src="${imgUrl(i.img, 800)}" onerror="imgFallback(this)">
            <div class="cap"><b>${esc(i.conf || '이미지')}</b>${confOf(i.conf)[1] ? ', ' + esc(confOf(i.conf)[1]) : ''}${i.src ? `<br>출처: ${esc(i.src)}` : ''}</div></div>` : ''}
          <div class="uselabel">사용 개수</div>
          <div class="quickbtns">
            <button data-act="quse" data-v="1">+1</button>
            <button data-act="quse" data-v="5">+5</button>
            <button data-act="quse" data-v="10">+10</button>
            <button data-act="qall">전량</button>
          </div>
          <button class="step plus" data-act="useDown" aria-label="사용 개수 1 줄이기">−</button>
          <input class="delta ${d > 0 ? 'use' : ''}" type="number" inputmode="numeric" min="0" max="${i.qty}" value="${d}" data-act="delta" aria-label="사용 개수">
          <button class="step minus" data-act="useUp" aria-label="사용 개수 1 늘리기">+</button>
          <input class="note" placeholder="메모 (현장, 용도 등)" data-act="note">
          <button class="confirm" data-act="confirm" ${d === 0 ? 'disabled' : ''}>사용 기록</button>
          <div class="preview">${d === 0 ? `현재 ${i.qty}개` : `${d}개 사용 → 남는 수량 ${i.qty - d}개`}</div>
          <button class="histbtn" data-act="hist" aria-pressed="${histRid === i.rid}">📋 사용 내역 ${histRid === i.rid ? '닫기' : '보기'}</button>

          <div class="rowbtns"><button data-act="edit">정보 수정</button><button class="danger" data-act="del">삭제</button>${i.img ? '' : '<button data-act="upload">📷 사진 업로드</button>'}</div>
        </div>

  /* ---------- 조작 ---------- */
  // 사용 개수: 0 ~ 현재 수량
  function setDelta(id, v) {
    const keep = document.querySelector(`.item[data-id="${CSS.escape(id)}"] .note`)?.value || '';
    const it = items.find(x => x.rid === id);
    const max = it ? Math.max(0, it.qty) : 0;
    let n = Number.isFinite(v) ? Math.trunc(v) : 0;
    if (n > max) { n = max; toast(`남은 수량(${max}개)보다 많이 쓸 수 없습니다.`, true); }
    deltas[id] = Math.max(0, n); render();
    const el = document.querySelector(`.item[data-id="${CSS.escape(id)}"] .note`); if (el) el.value = keep;
  }
  $('#list').addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const id = el.closest('.item').dataset.id, act = el.dataset.act;
    if (act === 'open') { openId = openId === id ? null : id; render(); }
    if (act === 'editloc') { startLocEdit(id, el); return; }
    if (act === 'useUp') setDelta(id, (deltas[id] || 0) + 1);
    if (act === 'useDown') setDelta(id, (deltas[id] || 0) - 1);
    if (act === 'quse') setDelta(id, (deltas[id] || 0) + Number(el.dataset.v));
    if (act === 'qall') { const it = items.find(x => x.rid === id); if (it) setDelta(id, it.qty); }
    if (act === 'hist') { histRid === id ? closeHist() : openHist(id); }
    if (act === 'confirm') confirmChange(id, el);
    if (act === 'edit') openModal(id);
    if (act === 'del') deleteItem(id);
    if (act === 'upload') { uploadRid = id; $('#imgFile').click(); }
  });

  $('#list').addEventListener('change', e => {

  /* ---------- 품목 등록/수정/삭제 ---------- */
  let editRid = null;
  /* 위치 인라인 편집: 위치 라벨 클릭 → 입력창 → Enter/포커스아웃 시 저장 */
  function startLocEdit(rid, locEl) {
    const it = items.find(x => x.rid === rid); if (!it || locEl.querySelector('input')) return;
    const cur = it.location || '';
    locEl.innerHTML = `<input class="locedit" value="${esc(cur)}" placeholder="위치 입력" aria-label="위치 수정">`;
    const inp = locEl.querySelector('input');
    inp.focus(); inp.select();
    let done = false;
    const finish = async (save) => {
      if (done) return; done = true;
      const v = inp.value.trim();
      if (save && v !== cur) {
        try {
          await api('updateItem', { user, rid, item: {
            code: it.code, name: it.name, qty: it.qty, location: v,
            order: it.order, batch: it.batch, note: it.note,
            body: it.body, diaphragm: it.diaphragm, matNote: it.matNote,
            memo: it.memoRaw, received: it.received

          toast('위치가 수정되었습니다.');
        } catch (err) { toast(err.message, true); }
        load();
      } else render();
    };
    inp.addEventListener('keydown', ev => {
      ev.stopPropagation();
      if (ev.key === 'Enter') finish(true);
      else if (ev.key === 'Escape') finish(false);

    inp.addEventListener('click', ev => ev.stopPropagation());
    inp.addEventListener('blur', () => finish(true));

  function openModal(rid) {

  async function deleteItem(rid) {

  /* ---------- 사진 업로드 ---------- */
  let uploadRid = null;
  function resizeImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(img.src);
        const max = 1200;
        let w = img.width, h = img.height;
        if (w > max || h > max) { const r = Math.min(max / w, max / h); w = Math.round(w * r); h = Math.round(h * r); }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob(b => {
          if (!b) { reject(new Error('이미지 변환 실패')); return; }
          const fr = new FileReader();
          fr.onload = () => resolve({ data: String(fr.result).split(',')[1], mime: 'image/jpeg' });
          fr.onerror = () => reject(new Error('이미지 읽기 실패'));
          fr.readAsDataURL(b);
        }, 'image/jpeg', 0.82);
      };
      img.onerror = () => reject(new Error('이미지를 열 수 없습니다.'));
      img.src = URL.createObjectURL(file);
    });
  }
  $('#imgFile').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f || !uploadRid) return;
    const it = items.find(i => i.rid === uploadRid); uploadRid = null;
    if (!it) return;
    toast('사진 업로드 중…');
    try {
      const { data, mime } = await resizeImage(f);
      await api('uploadImage', { user, code: it.code, image: data, mime });
      toast('사진이 등록되었습니다.'); load();
    } catch (err) { toast('업로드 실패: ' + err.message, true); }
  });

  async function confirmChange(rid, btn) {
    const used = deltas[rid] || 0;
    if (used <= 0) return;
    const note = btn.closest('.item').querySelector('.note').value.trim();
    btn.disabled = true; btn.textContent = '저장 중…';
    try {
      const r = await api('update', { user, rid, change: -used, note });
      const it = items.find(i => i.rid === r.rid); if (it) it.qty = r.qty;
      delete deltas[rid]; openId = null; if (histRid === rid) closeHist(); render();

  /* ---------- 품목별 사용 내역 팝업 (토글) ---------- */
  let histRid = null;
  async function fetchItemLogs(it) {

      return (await api('itemLogs', { rid: it.rid })).logs || [];
    } catch (e) {
      // API가 아직 itemLogs를 모르면(새 버전 배포 전) 엑셀용 전체 기록에서 골라냄
      const d = await api('export');

  /* ---------- 엑셀 다운로드 (원본 RDM_PBCR_Room_Materials_list 양식) ---------- */
  // 원본 서식: 맑은 고딕 12, 머리글 연두(D7E4BD)·재질/비고 머리글 남색(1F4E78)+흰 글씨,
  // A~F 얇은 테두리와 차수별 배경색, 위치·REMARK 가운데 정렬
  function buildWorkbook(d) {
    const FONT = { name: '맑은 고딕', sz: 12 };
    const thin = { style: 'thin', color: { rgb: '000000' } };
    const box = { top: thin, bottom: thin, left: thin, right: thin };
    const ws = XLSX.utils.aoa_to_sheet(d.total);
    const nCols = d.total[0].length;
    for (let r = 0; r < d.total.length; r++) {
      for (let c = 0; c < nCols; c++) {
        const ref = XLSX.utils.encode_cell({ r, c });
        if (!ws[ref]) ws[ref] = { t: 's', v: '' };
        const st = { font: { ...FONT }, alignment: { vertical: 'center' } };
        if (r === 0) {
          st.alignment.horizontal = 'center';
          if (c === 8) { st.fill = { patternType: 'solid', fgColor: { rgb: '1F4E78' } }; st.font = { ...FONT, bold: true, color: { rgb: 'FFFFFFFF' } }; }
          else if (c !== 9) st.fill = { patternType: 'solid', fgColor: { rgb: 'D7E4BD' } };
        } else {
          if (c <= 5) {
            st.border = box;
            const col = (d.colors || [])[r - 1];
            if (/^[0-9A-F]{6}$/.test(col || '')) st.fill = { patternType: 'solid', fgColor: { rgb: col } };
          }
          if (c === 4 || c === 5) st.alignment.horizontal = 'center';
          if (c === 4) { ws[ref].t = 's'; ws[ref].v = String(ws[ref].v); ws[ref].z = '@'; }
          if (c >= 10) st.alignment.horizontal = 'center';
        }
        ws[ref].s = st;
      }
    }
    ws['!cols'] = [32.6, 13.5, 60.3, 13.5, 20.2, 11.9, 12, 12, 16, 38].concat(Array(Math.max(0, nCols - 10)).fill(14)).map(w => ({ wch: w }));
    ws['!autofilter'] = { ref: `A1:F${d.total.length}` };

    const wl = XLSX.utils.aoa_to_sheet(d.log);
    for (let r = 0; r < d.log.length; r++) for (let c = 0; c < 7; c++) {
      const ref = XLSX.utils.encode_cell({ r, c }); if (!wl[ref]) continue;
      wl[ref].s = r === 0
        ? { font: { ...FONT, bold: true }, fill: { patternType: 'solid', fgColor: { rgb: 'D7E4BD' } }, alignment: { horizontal: 'center' }, border: box }
        : { font: { ...FONT, color: (c === 4 && wl[ref].v < 0) ? { rgb: 'C00000' } : undefined }, border: box };
    }
    wl['!cols'] = [17, 14, 13, 45, 8, 12, 40].map(w => ({ wch: w }));
    if (d.log.length > 1) wl['!autofilter'] = { ref: `A1:G${d.log.length}` };

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Total');
    XLSX.utils.book_append_sheet(wb, wl, 'Log');
    return wb;
  }

  $('#exportXlsx').addEventListener('click', async e => {
    const btn = e.target;
    if (typeof XLSX === 'undefined') { toast('엑셀 도구를 불러오지 못했습니다. 새로고침 후 다시 누르세요.', true); return; }
    btn.disabled = true; btn.textContent = '만드는 중…';
    try {
      const d = await api('export');
      XLSX.writeFile(buildWorkbook(d), `RDM_PBCR_Room_Materials_list_${d.stamp}.xlsx`);
      toast('엑셀 파일을 내려받았습니다.');
    } catch (err) { toast('엑셀 만들기 실패: ' + err.message, true); }
    btn.disabled = false; btn.textContent = '엑셀 다운로드';
  });

  if (user) start(); else showGate();
</script>
</body>
</html>
