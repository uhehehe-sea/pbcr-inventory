<!-- 구역 맵(3D) — Three.js (회전/확대 가능한 진짜 3D) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.144.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.144.0/examples/js/controls/OrbitControls.js"></script>
<script>
/**
 * PBCR 현장 용어 검색 (field-search.js)
 * 재고 앱(index.html)에 붙이는 검색 모듈. 외부 라이브러리 없음.
 *
 * 사용법
 *   (index.html 안에 넣어 사용)
 *   const results = FieldSearch.search(items, '서스304 어디있어?');
 *   // results: [{ item, score }]  — 점수 높은 순
 *   // 결과가 0건이면 FieldSearch.onMiss(query) 가 호출됨 (기본: 아무것도 안 함 → 로그 기록용으로 교체 가능)
 *
 * items 형식: 재고 API 'items' 응답 그대로 (code, name, matNote, body, diaphragm, note, memo, order, location …)
 *
 * 사전 추가: FieldSearch.addTerms([['SUS', ['서스','스텐']], ...])  — 시트 '용어사전' 탭을 읽어 넣을 때 사용
 */
(function (global) {
  'use strict';

  /* ---------- 1. 용어사전: [검색 키워드(들), [현장 용어들]] ----------
     키워드에 '|' 를 쓰면 "이 중 아무거나" (예: 'PTFE|TEFLON')
     ※ 현장 분들 확인 전 초안. 근거: 업체·자재몰 표기 조사 + 재고 품명 */
  const TERMS = [
    // 재질
    ['SUS', ['서스', '스텐', '스뎅', '스테인리스', '스테인레스', 'STS']],
    ['PTFE|TEFLON', ['테프론', '테플론', '테프']],
    ['FPM|FKM|VITON', ['바이톤', '불소고무', '비톤']],
    ['EPDM', ['이피디엠', '에틸렌프로필렌']],
    ['PVDF', ['피브이디에프', '피비디에프', '불소수지']],
    ['PEEK', ['피크']],
    ['PP', ['피피', '폴리프로필렌']],
    ['PVC', ['피브이씨', '피비씨']],
    ['AFLAS', ['아플라스']],
    ['PFA', ['피에프에이']],
    // 배관 부속
    ['ELBOW', ['엘보우', '엘보', '엘보우관']],
    ['TEE', ['티이', '티자', '티']],
    ['REDUCER', ['레듀샤', '레듀서', '리듀서']],
    ['FLANGE', ['후렌지', '플랜지', '프랜지']],
    ['NIPPLE', ['니뿌루', '니플']],
    ['UNION', ['유니온', '유니언']],
    ['SOCKET', ['소켓', '소케또']],
    ['PRESSURE REDUCING VALVE', ['감압밸브', '감압변']],
    ['PRESSURE', ['압력']],
    ['GAUGE|GAGE', ['게이지', '압력계']],
    ['VALVE', ['밸브', '벨브', '발브']],
    ['PACKING|GASKET', ['빠킹', '패킹', '가스켓', '개스킷']],
    ['O-RING|ORING|O RING', ['오링', '오-링']],
    ['FITTING', ['피팅']],
    ['PIPE', ['파이프', '배관']],
    // 체결
    ['BOLT', ['볼트', '보루또']],
    ['NUT', ['너트', '나또']],
    ['WASHER', ['와샤', '와셔']],
    ['SCREW|BOLT', ['나사', '스크류']],
    ['HEX', ['육각']],
    ['WRENCH', ['렌치', '랜치']],
    ['HEADLESS', ['무두']],
    ['ROUND HEAD', ['둥근머리', '라운드헤드']],
    // 부품·장비
    ['GRIPPER', ['그리퍼', '그립퍼', '집게']],
    ['HOLDER', ['홀더', '고정대']],
    ['COVER', ['커버', '덮개']],
    ['SUPPORT', ['서포트', '받침']],
    ['LEVEL', ['레벨', '수위']],
    ['SENSOR', ['센서', '쎈서']],
    ['CONDUCTIVITY', ['전도도']],
    ['CABLE', ['케이블', '케불']],
    ['DRAIN', ['드레인', '배수']],
    ['NOZZLE', ['노즐']],
    ['PUMP', ['펌프', '뽐뿌']],
    ['HEATER', ['히터']],
    ['ROLLER', ['롤러', '로라']],
    ['HANDLE', ['핸들', '손잡이']],
    ['SHAFT', ['샤프트', '축']],
    ['BEARING', ['베어링', '베아링']],
    ['PIN', ['핀']],
    ['BLOCK', ['블럭', '블록']],
    ['BATH', ['배스', '수조']],
    ['SOLENOID', ['솔레노이드', '솔밸브']],
    ['O3 GENERATOR', ['오존발생기', '오존']],
    ['WELDING', ['용접기', '용접']],
    ['LOCK', ['락', '잠금']],
    ['RAIL', ['레일']],
    ['INNER', ['이너', '안쪽']],
    ['WHITE', ['흰색', '화이트']],
    ['GRAY|GREY', ['회색', '그레이']]
  ];

  // 검색어에서 빼는 말 (말하듯이 쳐도 되게)
  const FILLER = ['어디있어', '어디 있어', '어디있나', '어디있지', '어디에', '어디', '위치', '있어', '있나',
    '몇개', '몇 개', '찾아줘', '찾아', '알려줘', '보여줘', '재고', '좀', '요'];
  const JOSA = /(은|는|이|가|을|를|에|의|도|랑|하고)$/;

  let dict = [];   // [{ alias, alts:[...] }] — 긴 별칭 먼저
  function buildDict(list) {
    list.forEach(([key, aliases]) => {
      const alts = String(key).toUpperCase().split('|').map(s => s.trim()).filter(Boolean);
      aliases.forEach(a => dict.push({ alias: String(a).toUpperCase(), alts }));
    });
    dict.sort((a, b) => b.alias.length - a.alias.length);
  }
  buildDict(TERMS);

  /* ---------- 2. 정규화 ---------- */
  function norm(s) {
    return String(s || '')
      .normalize('NFKC')                 // 전각 → 반각
      .toUpperCase()
      .replace(/\bSTS\s*[-_]?\s*(?=\d{3})/g, 'SUS')            // KS 표기 STS304 → SUS304
      .replace(/\bSUS\s*[-_]?\s*(\d{3}L?)\b/g, 'SUS$1')         // SUS 304 / SUS-304 → SUS304
      .replace(/\bPP\s*[-_]\s*([HNW])\b/g, 'PP-$1')              // PP H → PP-H
      .replace(/\b(M\d{1,2})\s*[X*×]\s*(\d{1,3})\s*L?\b/g, '$1 $1*$2'); // M5*20L → M5 M5*20
  }

  // 품목 → 검색용 문자열 (품명 가중치를 위해 따로 보관)
  function hay(item) {
    const name = norm(item.name);
    const other = norm([item.matNote, item.body, item.diaphragm, item.note, item.memo, item.order].join(' '));
    // 한글명·현장명 열(있으면): 품명과 같은 가중치
    const ko = norm([item.ko, item.koName, item.krName, item.alias, item.aliases, item['한글명'], item['현장명']].filter(Boolean).join(' '));
    return { name: name + (ko ? ' ' + ko : ''), other, code: String(item.code || '').toUpperCase() };
  }

  /* ---------- 3. 검색어 → 조건 목록 ---------- */
  // 결과: [{ alts:[...], raw }]  — 모든 조건을 만족(AND), 각 조건은 alts 중 하나(OR)
  function parse(query) {
    let q = String(query || '').normalize('NFKC').toUpperCase().replace(/[?!.,~]/g, ' ');
    FILLER.forEach(f => { q = q.split(f.toUpperCase()).join(' '); });

    // 사전 치환: 현장 용어 → {키워드|키워드}
    const groups = [];
    dict.forEach(({ alias, alts }) => {
      if (!/[가-힣]/.test(alias) && alias.length <= 3) {
        // 짧은 영문 별칭(STS 등)은 단어 경계에서만
        const re = new RegExp('\\b' + alias + '(?=\\d|\\b)', 'g');
        q = q.replace(re, () => ' §' + (groups.push(alts) - 1) + '§ ');
      } else {
        q = q.split(alias).join(' §' + groups.length + '§ ');
        // 한글 별칭 자체도 후보에 남김 → 시트의 '한글명/현장명' 열과도 맞춰봄
        if (q.indexOf('§' + groups.length + '§') >= 0) groups.push(/[가-힣]/.test(alias) ? alts.concat([alias]) : alts);
      }
    });

    // 그룹 + 바로 뒤 숫자 등급 붙이기: "§0§ 304" (서스304) → SUS304
    q = q.replace(/§(\d+)§\s*[-_]?\s*(\d{3}L?)\b/g, (m, g, n) => {
      const alts = groups[g];
      return alts.indexOf('SUS') >= 0 ? ' SUS' + n + ' ' : m;
    });
    q = norm(q.replace(/§(\d+)§/g, (m, g) => ' {#' + g + '} '));

    const terms = [];
    q.split(/\s+/).filter(Boolean).forEach(tok => {
      const g = tok.match(/^\{#(\d+)\}$/);
      if (g) { terms.push({ alts: groups[g[1]], raw: groups[g[1]].join('|') }); return; }
      tok = tok.replace(/^[^\w가-힣*-]+|[^\w가-힣*-]+$/g, '');
      if (/[가-힣]/.test(tok)) tok = tok.replace(JOSA, '');
      if (!tok) return;
      terms.push({ alts: [tok], raw: tok });
    });
    return terms;
  }

  /* ---------- 4. 한 조건이 품목에 맞는지 ---------- */
  function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function matchAlt(alt, h) {
    const text = h.name + ' ' + h.other;
    // 4자리 숫자만 → 코드 뒤 4자리
    if (/^\d{4}$/.test(alt)) return h.code.endsWith(alt) ? 3 : 0;
    // 전체 코드
    if (/^[A-Z]{2}\d{8}$/.test(alt)) return h.code === alt ? 5 : 0;
    // 재질 등급 (SUS304 → SUS304, SUS304L 은 매칭 / SUS316 은 제외)
    if (/^SUS\d{3}L?$/.test(alt)) {
      const re = new RegExp('\\b' + alt + '(?!\\d)');
      return re.test(h.name) ? 2 : re.test(h.other) ? 1 : 0;
    }
    // SUS 단독 → SUS, SUS304, SUS316 … 전부
    if (alt === 'SUS') {
      const re = /\bSUS(\d{3}L?)?\b/;
      return re.test(h.name) ? 2 : re.test(h.other) ? 1 : 0;
    }
    // 숫자만(4자리 아님) → 단독 숫자로만 (예: 304 가 800047304 에 걸리지 않게)
    if (/^\d+$/.test(alt)) {
      const re = new RegExp('(^|[^\\d])' + alt + '(?!\\d)');
      return re.test(h.name) ? 2 : re.test(h.other) ? 1 : 0;
    }
    // 볼트 규격 M5 → M5 (M50 제외)
    if (/^M\d{1,2}(\*\d+)?$/.test(alt)) {
      const re = new RegExp('\\b' + esc(alt) + '(?![\\d])');
      return re.test(h.name) ? 2 : re.test(h.other) ? 1 : 0;
    }
    // 짧은 영문(3자 이하: TEE, PIN, NUT, PP …) → 단어 시작 경계
    if (/^[A-Z0-9-]{1,3}$/.test(alt)) {
      const re = new RegExp('(^|[^A-Z])' + esc(alt) + '(?![A-Z])');
      return re.test(h.name) ? 2 : re.test(h.other) ? 1 : 0;
    }
    // 그 외(긴 영문·한글·구문) → 포함 여부
    return h.name.indexOf(alt) >= 0 ? 2 : text.indexOf(alt) >= 0 ? 1 : 0;
  }

  /* ---------- 5. 검색 ---------- */
  function search(items, query) {
    const terms = parse(query);
    if (!terms.length) return [];
    const out = [];
    (items || []).forEach(item => {
      const h = hay(item);
      let score = 0;
      for (const t of terms) {
        let best = 0;
        for (const a of t.alts) best = Math.max(best, matchAlt(a, h));
        if (!best) return;          // 모든 조건을 만족해야 함
        score += best;
      }
      if (Number(item.qty) > 0) score += 0.5; // 재고 있는 품목 먼저
      out.push({ item, score });
    });
    out.sort((a, b) => b.score - a.score);
    if (!out.length) FieldSearch.onMiss(query, terms);
    return out;
  }

  const FieldSearch = {
    search,
    parse,                                   // 디버깅용: FieldSearch.parse('서스304 어디있어')
    addTerms(list) { buildDict(list); },     // 시트 '용어사전' 탭 내용 추가
    onMiss() {},                             // 0건 검색어 기록용으로 교체
    TERMS
  };
  global.FieldSearch = FieldSearch;
  if (typeof module !== 'undefined') module.exports = FieldSearch;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<style>
  :root {

    --sans: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --num: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --concrete: #151a19; --surface: #1f2624; --ink: #E6EAE8; --muted: #93A09B; --line: #34403C;
      --head: #0f1312; --head-sub: #93A09B; --field: #2a3331; --steel: #5B8DB0; --in: #4FA872; --out: #D9654F;
    }
  }
  :root[data-theme="dark"] {
    --concrete: #151a19; --surface: #1f2624; --ink: #E6EAE8; --muted: #93A09B; --line: #34403C;
    --head: #0f1312; --head-sub: #93A09B; --field: #2a3331; --steel: #5B8DB0; --in: #4FA872; --out: #D9654F;
  }

  *, *::before, *::after { box-sizing: border-box; }

  :focus-visible { outline: 3px solid var(--steel); outline-offset: 2px; }

  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--head); color: var(--head-text); padding: 12px 16px; }

  main { max-width: 760px; margin: 0 auto; padding: 12px 12px 96px; }
  .meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; color: var(--muted); font-size: .85rem; padding: 4px 4px 10px; }

  .item:last-child { border-radius: 0 0 8px 8px; border-bottom: none; }
  .item:only-child { border-radius: 8px; }

  .qty.zero { color: var(--out); }
  .qty .recv { display: block; font-family: var(--sans); font-weight: 400; font-size: .8rem; color: var(--muted); }
  .pbar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 4px; overflow: hidden; }
  .pbar i { display: block; height: 100%; background: var(--in); border-radius: 2px; }
  .status { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-top: 4px; }

  .status.opened { background: var(--steel); color: #fff; }
  .status.empty { background: var(--out); color: #fff; }

  .edit { grid-column: 1 / -1; display: none; gap: 8px; align-items: center; padding-top: 4px; flex-wrap: wrap; }

  .step.minus { background: var(--out); } .step.plus { background: var(--in); }
  .delta { width: 72px; height: 48px; text-align: center; border: 2px solid var(--line); border-radius: 6px; font-family: var(--num); font-size: 1.5rem; font-weight: 700; background: var(--field); }
  .delta.neg { color: var(--out); border-color: var(--out); } .delta.pos { color: var(--in); border-color: var(--in); }

<div class="ux u070-zone" id="toastZone" role="region" aria-label="알림" tabindex="-1"><div class="u070-live" aria-live="polite"></div></div>

<script>
  /* ▼▼ 재고 API(Apps Script 웹 앱) 주소 — GitHub 등 외부에 올릴 때만 사용. Apps Script 안에서는 자동으로 google.script.run 사용 ▼▼ */
  const API_URL = 'https://script.google.com/macros/s/AKfycbzMdFhru-2JC3U9Udnq63s8OK4Svt0rHTGgby6Gyes7k7Fvos5QwCo_BMltlWUXi-J1/exec';   // 재고앱_멀티사이트_API (PBCR 고정)
  /* ▲▲▲▲ */
  const IS_GAS = !!(window.google && google.script && google.script.run);
  const COUNT_OLD_DAYS = 30;   // 이 일수보다 오래 안 센 품목은 '실사 필요' (실사 UI 자체는 receive.html로 이동)

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const store = {
    get: k => { try { return localStorage.getItem('pbcr_' + k) || ''; } catch (_) { return ''; } },
    set: (k, v) => { try { localStorage.setItem('pbcr_' + k, v); } catch (_) {} },
    del: k => { try { localStorage.removeItem('pbcr_' + k); } catch (_) {} }
  };

  let user = store.get('user');
  const site = { id: 'PBCR', name: 'PBCR', map: true };   // 이 화면은 PBCR 전용 — 멀티사이트 API에 PBCR로 고정 연결
  let items = [], logs = [], openId = null, busy = false, tab = 'stock';
  let filter = { kind: '', loc: '' };   // kind: low | zero | old
  const deltas = {};  // rid -> 사용 개수 (양수). 저장할 때 -사용개수로 기록

  /* ================= 오프라인 모드 ================= */
  const DB_NAME = 'pbcr-inventory';
  function idb() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function idbGet(key) {
    const db = await idb();
    return new Promise((res, rej) => {
      const q = db.transaction('kv').objectStore('kv').get(key);
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  }
  async function idbSet(key, val) {
    const db = await idb();
    return new Promise((res, rej) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(val, key);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }
  // 읽기·수정·쓰기를 한 트랜잭션으로 — 전송하는 동안 새로 쌓인 기록이 덮어써져 사라지지 않게
  async function idbUpdate(key, fn) {
    const db = await idb();
    return new Promise((res, rej) => {
      const tx = db.transaction('kv', 'readwrite'), st = tx.objectStore('kv');
      let out;
      const q = st.get(key);
      q.onsuccess = () => { out = fn(q.result); st.put(out, key); };
      tx.oncomplete = () => res(out);
      tx.onerror = () => rej(tx.error);
    });
  }
  const snapKey = () => 'snapshot:' + (site && site.id ? site.id : '-');   // 재고 스냅샷은 사이트별로 따로
  const recSite = x => (x && x.params && x.params.siteId) || 'PBCR';       // siteId 없는 예전 기록 = PBCR
  let offlineNotified = false;
  function newId() {
    return (crypto.randomUUID && crypto.randomUUID()) ||
      Date.now().toString(36) + Math.random().toString(36).slice(2);
  }
  function fmtSyncTime(iso) {
    try {
      const d = new Date(iso);
      return (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
        String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    } catch (_) { return ''; }
  }
  function setSyncLabel(offTime) {
    const el = document.getElementById('syncStatus'); if (!el) return;
    if (navigator.onLine && !offTime) { el.innerHTML = '<i class="dot"></i>온라인'; el.classList.remove('off'); }
    else { el.innerHTML = '<i class="dot"></i>오프라인' + (offTime ? ' · ' + fmtSyncTime(offTime) : ''); el.classList.add('off'); }
  }
  async function renderPendingBadge() {
    const el = document.getElementById('pendingBadge'); if (!el) return;
    try {
      const box = (await idbGet('outbox')) || [];
      if (box.length) { el.hidden = false; el.textContent = '전송 대기 ' + box.length + '건 — 인터넷 연결 시 자동 전송됩니다'; }
      else el.hidden = true;
    } catch (_) {}
  }
  // 오프라인 사용 기록: 화면에 바로 반영 + 전송 대기함(outbox)에 저장. api() 응답 형태로 반환.
  // 오프라인 지원은 '사용 기록'만 — 이동·등록·수정·사진은 온라인에서만
  async function queueOffline(req) {
    if (req.action !== 'update') throw new Error('오프라인에서는 사용 기록만 저장할 수 있습니다.');
    if (!site || !site.id) throw new Error('사이트가 선택되지 않았습니다.');
    const at = new Date().toISOString();
    const it = items.find(i => String(i.rid) === String(req.rid));
    if (!it) throw new Error('품목을 찾을 수 없습니다.');
    const change = Number(req.change);
    const after = (Number(it.qty) || 0) + change;
    if (after < 0) throw new Error('재고가 부족합니다. 현재 ' + it.qty + '개입니다.');
    const rec = { id: req.opId || newId(), at, action: 'update',
      params: { siteId: site.id, user: req.user || user, rid: String(req.rid), change, note: req.note || '' } };
    await idbUpdate('outbox', box => (box || []).filter(x => x.id !== rec.id).concat([rec]));
    it.qty = after;
    try { await idbSet(snapKey(), { items, logs, savedAt: at }); } catch (_) {}
    renderAll();
    renderPendingBadge();
    return { ok: true, rid: String(req.rid), qty: after, code: it.code, queued: true };
  }
  // 서버에서 받은 수량 위에, 아직 전송 안 된 이 사이트의 사용 기록을 얹어서 보여 줌
  async function applyPending(list) {
    let box = [];
    try { box = (await idbGet('outbox')) || []; } catch (_) { return list; }
    box.filter(x => x.action === 'update' && site && recSite(x) === site.id).forEach(x => {
      const it = list.find(i => String(i.rid) === String(x.params.rid));
      if (it) it.qty = Math.max(0, (Number(it.qty) || 0) + Number(x.params.change || 0));
    });
    return list;
  }
  let flushing = false;
  async function flush() {
    if (flushing || !navigator.onLine) return;
    let box = [];
    try { box = (await idbGet('outbox')) || []; } catch (_) { return; }
    if (!box.length) return;
    flushing = true;
    try {
      const data = await apiRaw('syncRecords', { items: box.slice(0, 200) });
      const sent = new Set(data.accepted || []);
      await idbUpdate('outbox', cur => (cur || []).filter(x => !sent.has(x.id)));
      renderPendingBadge();
      const warns = data.warnings || [];
      if (warns.length) TOAST.push('err', '동기화 확인 필요 ' + warns.length + '건', { sub: warns.slice(0, 3).join(' / '), dur: 12000 });
      if (sent.size) { toast('오프라인 기록 ' + sent.size + '건 전송됨'); load(); }

    finally { flushing = false; }

  window.addEventListener('offline', () => setSyncLabel());
  document.addEventListener('visibilitychange', () => { if (!document.hidden) flush(); });
  setInterval(flush, 60000);
  /* 다크모드 수동 토글 */
  (function () {
    const root = document.documentElement;
    const btn = document.getElementById('themeToggle');
    function apply(t) {
      if (t) root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
      if (btn) btn.textContent = (t || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark' ? '☀️' : '🌙';
    }
    let saved = null;
    try { saved = localStorage.getItem('pbcr_theme'); } catch (_) {}
    apply(saved);
    if (btn) btn.addEventListener('click', () => {
      const cur = root.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      const next = cur === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('pbcr_theme', next); } catch (_) {}
      apply(next);
    });
  })();
  /* =============== 오프라인 모드 끝 =============== */

  // 서버가 거절한 것(재고 부족 등)과 연결이 안 된 것을 구분 — 연결 문제만 전송 대기함으로 보냄
  const netErr = msg => { const e = new Error(msg || '인터넷 연결을 확인하세요.'); e.network = true; return e; };
  const API_TIMEOUT = 20000;   // 사용 기록 저장이 이 시간 안에 응답이 없으면 대기함으로 (신호 약한 창고)
  const withTimeout = p => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(netErr('서버 응답이 없습니다.')), API_TIMEOUT))]);
  function apiRaw(action, body) {
    const req = Object.assign({ action }, body || {});
    req.siteId = site.id;
    if (user && !req.user) req.user = user;
    if (IS_GAS) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(data => {
            if (!data) reject(new Error('서버 응답이 비어 있습니다.'));
            else if (!data.ok) reject(new Error(data.error || '요청 실패'));
            else resolve(data);
          })
          .withFailureHandler(err => reject(netErr((err && err.message) || String(err))))
          .apiCall(JSON.stringify(req));
      });
    }
    return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req) })
      .catch(e => { throw netErr(e.message); })
      .then(r => r.json().catch(() => { throw netErr('서버 응답을 읽지 못했습니다.'); }))
      .then(data => { if (!data.ok) throw new Error(data.error || '요청 실패'); return data; });
  }
  // 사용 기록(update): 기록마다 고유 번호(opId)를 붙이고, 오프라인이거나 연결이 실패하면 전송 대기함에 저장
  async function api(action, body) {
    if (action !== 'update') return apiRaw(action, body);
    const req = Object.assign({}, body || {}, { opId: (body && body.opId) || newId() });
    if (!navigator.onLine) return queueOffline(Object.assign({ action }, req));
    try { return await withTimeout(apiRaw(action, req)); }
    catch (e) { if (e.network) return queueOffline(Object.assign({ action }, req)); throw e; }
  }

  /* ---------- 알림: Lucian UX/UI Prompt #070 겹쳐 쌓이는 토스트 · MIT License (c) 2026 Seokwoooo ---------- */
  const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TOAST = (function () {

    const COLOR = { ok: 'var(--ux-mint)', err: 'var(--ux-danger)', info: 'var(--ux-accent)', wait: 'var(--ux-warn)' };

        else { el.style.setProperty('--y', -(i * 14) + 'px'); el.style.setProperty('--s', (1 - i * 0.06).toFixed(2)); el.style.setProperty('--o', i > 2 ? 0 : 1); }
        el.style.zIndex = 50 - i;
        el.inert = !open && i > 0;
      });
    }
    function remove(t, dir, byUser) {
      const i = list.indexOf(t); if (i < 0) return;
      list.splice(i, 1);
      t.el.classList.add('leave');
      if (dir) { t.el.style.setProperty('--dir', dir); t.el.classList.add('side'); }

      layout();

    }
    function set(t, k, title, sub) {
      t.k = k; t.el.style.setProperty('--c', COLOR[k]);
      t.el.setAttribute('role', k === 'err' ? 'alert' : 'status');
      t.el.querySelector('.u070-ic').innerHTML = ICON[k];
      t.el.querySelector('b').textContent = title; t.el.querySelector('small').textContent = sub || '';
      t.left = k === 'wait' ? Infinity : t.dur; live.textContent = title;

    function push(k, title, opt) {
      opt = opt || {};
      const el = document.createElement('div');

      el.innerHTML = '<span class="u070-ic" aria-hidden="true"></span><span class="u070-tx"><b></b><small></small></span>' + (opt.action ? '<button class="u070-act" type="button"></button>' : '') + '<button class="u070-x" type="button" aria-label="알림 닫기"><svg viewBox="0 0 14 14"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7"/></svg></button><span class="u070-bar" aria-hidden="true"></span>';
      const t = { el, dur: opt.dur || DUR, onClose: opt.onClose };
      set(t, k, title, opt.sub);
      if (opt.action) { const a = el.querySelector('.u070-act'); a.textContent = opt.action; a.addEventListener('click', () => { if (opt.onAction) opt.onAction(); t.onClose = null; remove(t); }); }
      zone.appendChild(el);

  /* ---------- 목록 조작 ---------- */
  function setDelta(id, v) {

  function mountHold(btn, onDone) {
    const HOLD = 1200;
    let p = 0, raf = 0, last = 0, holding = false, finished = false;
    const set = v => { p = v; btn.style.setProperty('--p', v.toFixed(4)); };
    function tick(now) {
      if (!btn.isConnected) return;
      const dt = now - (last || now); last = now;
      if (holding) set(Math.min(1, p + dt / HOLD)); else set(Math.max(0, p - dt / (HOLD / 2.4)));
      btn.style.setProperty('--shake', holding && p > 0.55 && !RM ? 'running' : 'paused');
      if (p >= 1 && holding) { holding = false; finished = true; raf = 0; btn.classList.remove('is-holding'); onDone(); return; }
      if (holding || p > 0) raf = requestAnimationFrame(tick); else { raf = 0; last = 0; }
    }
    const start = () => { if (finished) return; holding = true; btn.classList.add('is-holding'); if (!raf) { last = 0; raf = requestAnimationFrame(tick); } };
    const stop = () => { holding = false; btn.classList.remove('is-holding'); if (!raf && p > 0) raf = requestAnimationFrame(tick); };
    btn.addEventListener('pointerdown', e => { if (e.button === 0) { btn.setPointerCapture(e.pointerId); start(); } });
    btn.addEventListener('pointerup', stop);
    btn.addEventListener('pointercancel', stop);
    btn.addEventListener('lostpointercapture', stop);
    btn.addEventListener('contextmenu', e => e.preventDefault());
    btn.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!e.repeat) start(); } });
    btn.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') stop(); });
    btn.addEventListener('blur', stop);
    btn.addEventListener('click', e => e.preventDefault());

    if (!item.code || !item.name) { $('#modalErr').textContent = 'SEA-CODE와 규격(이름)을 입력하세요.'; return; }
    const btn = $('#modalSave'); btn.disabled = true; btn.textContent = '저장 중…';
    const wasEdit = !!editRid;
    try {
      if (wasEdit) await api('updateItem', { user, rid: editRid, item });
      else await api('addItem', { user, item });
      closeModal(); toast(wasEdit ? '수정되었습니다. (사용 내역에서 되돌릴 수 있어요)' : '등록되었습니다.'); load();
    } catch (e) { $('#modalErr').textContent = e.message; }
    btn.disabled = false; btn.textContent = '저장';
  });

  // 길게 눌러 확정 → 알림의 '되돌리기'로 취소 가능. 알림이 사라지면 실제로 삭제
  const pendingDel = {};
  function deleteItem(rid) {
    const it = items.find(i => i.rid === rid); if (!it) return;
    const el = document.querySelector(`.item[data-id="${CSS.escape(rid)}"]`); if (el) el.classList.add('is-gone');
    pendingDel[rid] = true; openId = null;
    TOAST.push('info', `${it.ko || it.name} 삭제`, { sub: it.code + ' · 잠시 뒤 삭제돼요', action: '되돌리기',
      onAction: () => { delete pendingDel[rid]; render(); toast('삭제를 취소했어요'); },
      onClose: async () => {
        if (!pendingDel[rid]) return;
        try { await api('deleteItem', { user, rid }); toast('삭제했어요', false, it.code); }
        catch (e) { toast(e.message, true); }
        delete pendingDel[rid]; load();
      } });
    setTimeout(render, 450);
  }

  /* ---------- 사진 업로드 ---------- */
  let uploadRid = null;
  function resizeImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(img.src);
        const max = 1200;
        let w = img.width, h = img.height;
        if (w > max || h > max) { const r = Math.min(max / w, max / h); w = Math.round(w * r); h = Math.round(h * r); }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob(b => {
          if (!b) { reject(new Error('이미지 변환 실패')); return; }
          const fr = new FileReader();
          fr.onload = () => resolve({ data: String(fr.result).split(',')[1], mime: 'image/jpeg' });
          fr.onerror = () => reject(new Error('이미지 읽기 실패'));
          fr.readAsDataURL(b);
        }, 'image/jpeg', 0.82);
      };
      img.onerror = () => reject(new Error('이미지를 열 수 없습니다.'));
      img.src = URL.createObjectURL(file);
    });
  }
  $('#imgFile').addEventListener('change', async e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f || !uploadRid) return;
    const it = items.find(i => i.rid === uploadRid); uploadRid = null;
    if (!it) return;
    const w = TOAST.push('wait', '사진 올리는 중…', { sub: it.code });
    try {
      const { data, mime } = await resizeImage(f);
      await api('uploadImage', { user, code: it.code, image: data, mime });
      w.done('ok', '사진이 등록되었습니다.', it.code); load();
    } catch (err) { w.done('err', '업로드 실패', err.message); }
  });

  /* ---------- 엑셀 다운로드 (원본 RDM_PBCR_Room_Materials_list 양식) ----------
     Total 시트 = 원본과 같은 9열, 위치순 정렬, 항차별 행 색
     앱 전용 정보(실사·한글명·현장명·메모)는 '앱정보' 시트, 사용내역은 'Log' 시트로 분리 */
  const RAW_COLS = 9; // Contents, SEA-CODE, 규격, PBCR 수량, 위치, REMARK, Body 재질, Diaphragm 재질, 재질/비고
  // 항차별 색 팔레트 (서로 잘 구분되는 연한 색). 다 쓰면 색상환을 돌며 자동 생성
  const BATCH_PALETTE = ['FFF2CC','DDEBF7','E2EFDA','FCE4D6','EDE2F6','D9F2F2','FFE0E9','EAF1C9',
                         'F8E1C4','D6E0F5','D0EBD5','F4D9D0','E4E4F7','FFF7B3','D3EEF9','F2DCEB'];
  // '149th,154th'처럼 여러 항차가 적힌 경우 가장 최근 항차 기준
  function batchNum(b) { const m = String(b || '').match(/\d+(?=st|nd|rd|th)/gi); return m ? Math.max(...m.map(Number)) : null; }
  function hslHex(h, s, l) {
    s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)))).toString(16).padStart(2, '0');
    return (f(0) + f(8) + f(4)).toUpperCase();
  }
  function batchColors(rows) {
    // 항차 번호 오름차순으로 색 고정 배정 → 같은 항차는 매번 같은 색
    const nums = [...new Set(rows.map(r => batchNum(r[5])).filter(n => n !== null))].sort((a, b) => a - b);
    const map = {};
    nums.forEach((n, i) => { map[n] = i < BATCH_PALETTE.length ? BATCH_PALETTE[i] : hslHex((i * 137.5) % 360, 60, 88); });
    return map;
  }
  // 원본 위치 순서: 1-1 → 1-2 → … → 9-2 → OPL렉 → Pallet → 기타 → 위치 없음
  function locKey(loc) {
    const s = String(loc || '').trim();
    if (!s) return [9, 0, 0, ''];
    const m = s.match(/^(\d+)-(\d+)$/);
    if (m) return [0, Number(m[1]), Number(m[2]), ''];
    if (/^OPL/i.test(s)) return [1, 0, 0, s];
    if (/^pallet/i.test(s)) return [2, 0, 0, s];
    return [3, 0, 0, s];
  }
  function cmpRows(a, b) {
    const ka = locKey(a.row[4]), kb = locKey(b.row[4]);
    for (let i = 0; i < 3; i++) if (ka[i] !== kb[i]) return ka[i] - kb[i];
    if (ka[3] !== kb[3]) return ka[3] < kb[3] ? -1 : 1;
    const na = batchNum(a.row[5]), nb = batchNum(b.row[5]);           // 같은 위치 안: 최신 항차 먼저, 항차 없는 품목은 뒤
    if (na !== nb) return (nb === null ? -1 : nb) - (na === null ? -1 : na) || (na === null ? 1 : -1);
    return a.i - b.i;                                                   // 나머지는 기존 순서 유지
  }

  function buildWorkbook(d) {
    const FONT = { name: '맑은 고딕', sz: 12 };
    const thin = { style: 'thin', color: { rgb: '000000' } };
    const box = { top: thin, bottom: thin, left: thin, right: thin };
    const head = d.total[0];
    const body = d.total.slice(1).map((row, i) => ({ row, i })).sort(cmpRows).map(o => o.row);
    const colorOf = batchColors(body);

    // 1) Total — 원본 9열
    const total = [head.slice(0, RAW_COLS)].concat(body.map(r => r.slice(0, RAW_COLS)));
    const ws = XLSX.utils.aoa_to_sheet(total);
    for (let r = 0; r < total.length; r++) {
      const fill = r > 0 ? colorOf[batchNum(total[r][5])] : null;
      for (let c = 0; c < RAW_COLS; c++) {
        const ref = XLSX.utils.encode_cell({ r, c });
        if (!ws[ref]) ws[ref] = { t: 's', v: '' };
        const st = { font: { ...FONT }, alignment: { vertical: 'center' }, border: box };
        if (r === 0) {
          st.alignment.horizontal = 'center';
          if (c === 8) { st.fill = { patternType: 'solid', fgColor: { rgb: '1F4E78' } }; st.font = { ...FONT, bold: true, color: { rgb: 'FFFFFFFF' } }; }
          else st.fill = { patternType: 'solid', fgColor: { rgb: 'D7E4BD' } };
        } else {
          if (fill) st.fill = { patternType: 'solid', fgColor: { rgb: fill } };
          if (c === 3 || c === 4 || c === 5) st.alignment.horizontal = 'center';
          if (c === 4) { ws[ref].t = 's'; ws[ref].v = String(ws[ref].v); ws[ref].z = '@'; }
        }
        ws[ref].s = st;
      }
    }
    ws['!cols'] = [32.6, 13.5, 60.3, 13.5, 20.2, 11.9, 12, 12, 16].map(w => ({ wch: w }));
    ws['!autofilter'] = { ref: `A1:I${total.length}` };

    // 2) 앱정보 — 앱에서만 쓰는 열 (Total과 같은 행 순서)
    const extraIdx = head.map((h, i) => i).filter(i => i >= RAW_COLS);
    const info = [['SEA-CODE', '규격', '위치'].concat(extraIdx.map(i => head[i] || '메모'))]
      .concat(body.map(r => [r[1], r[2], r[4]].concat(extraIdx.map(i => r[i] === undefined ? '' : r[i]))));
    const wi = XLSX.utils.aoa_to_sheet(info);
    for (let r = 0; r < info.length; r++) for (let c = 0; c < info[0].length; c++) {
      const ref = XLSX.utils.encode_cell({ r, c }); if (!wi[ref]) continue;
      wi[ref].s = r === 0 ? { font: { ...FONT, bold: true }, fill: { patternType: 'solid', fgColor: { rgb: 'D7E4BD' } }, alignment: { horizontal: 'center' }, border: box }
                          : { font: { ...FONT }, border: box };
    }
    wi['!cols'] = [13.5, 45, 12].concat(extraIdx.map(() => 22)).map(w => ({ wch: w }));

    // 3) Log — 기존 그대로
    const wl = XLSX.utils.aoa_to_sheet(d.log);
    const lc = d.log[0].length, chgCol = d.log[0].indexOf('변동');
    for (let r = 0; r < d.log.length; r++) for (let c = 0; c < lc; c++) {
      const ref = XLSX.utils.encode_cell({ r, c }); if (!wl[ref]) continue;
      wl[ref].s = r === 0
        ? { font: { ...FONT, bold: true }, fill: { patternType: 'solid', fgColor: { rgb: 'D7E4BD' } }, alignment: { horizontal: 'center' }, border: box }
        : { font: { ...FONT, color: (c === chgCol && wl[ref].v < 0) ? { rgb: 'C00000' } : undefined }, border: box };
    }
    wl['!cols'] = [17, 12, 13, 45, 10, 8, 12, 20, 40].slice(0, lc).map(w => ({ wch: w }));
    if (d.log.length > 1) wl['!autofilter'] = { ref: `A1:${XLSX.utils.encode_col(lc - 1)}${d.log.length}` };

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Total');
    XLSX.utils.book_append_sheet(wb, wi, '앱정보');
    XLSX.utils.book_append_sheet(wb, wl, 'Log');
    return wb;
  }

  $('#exportXlsx').addEventListener('click', async e => {
    const btn = e.target;
    if (typeof XLSX === 'undefined') { toast('엑셀 도구를 불러오지 못했습니다. 새로고침 후 다시 누르세요.', true); return; }
    btn.disabled = true; btn.textContent = '만드는 중…';
    try {
      const d = await api('export');
      XLSX.writeFile(buildWorkbook(d), `RDM_PBCR_Room_Materials_list_${d.stamp}.xlsx`);
      toast('엑셀 파일을 내려받았습니다.');
    } catch (err) { toast('엑셀 만들기 실패: ' + err.message, true); }
    btn.disabled = false; btn.textContent = '엑셀 다운로드';
  });

  /* ---------- 구역 맵(3D) ----------
     카터스빌 자재룸 배치도(손그림) 기준 — ㄱ자 배치:
       오른쪽 벽: 랙 1(아래, 입구 쪽) → 랙 2(위)
       위쪽 벽:   랙 3(오른쪽 모서리) → 랙 4(왼쪽)
       왼쪽:      번호 없는 구역 2곳(ZONES)
     좌표 단위는 미터(m), 위에서 내려다볼 때 x=오른쪽, z=아래(입구 쪽).
     len(랙 길이)·위치는 손그림 비율로 잡은 값 — 실측 후 숫자만 고치면 됩니다.
     face: 선반 앞면이 바라보는 방향('left' = 방 안쪽 왼쪽, 'down' = 방 안쪽 아래).
     levels 번호는 위에서부터 1번(예: 1-1), 아래로 갈수록 커집니다(1-2, 1-3 …). */
  const RACK_DEPTH = 0.6;   // 랙 깊이(m)
  const RACKS = [
    { id: '1', levels: 4, feet: 6, len: 2.4,  x: 1.8,   z: 1.31,  face: 'left' },  // 오른쪽 벽 아래
    { id: '2', levels: 4, feet: 6, len: 1.95, x: 1.8,   z: -0.86, face: 'left' },  // 오른쪽 벽 위
    { id: '3', levels: 4, feet: 6, len: 2.4,  x: 0.3,   z: -2.14, face: 'down' },  // 위쪽 벽 오른쪽(모서리)
    { id: '4', levels: 4, feet: 6, len: 2.0,  x: -1.9,  z: -2.14, face: 'down' }   // 위쪽 벽 왼쪽
  ];
  // 번호 없는 바닥 구역(팔레트·작업대 등) — 클릭 대상 아님. 용도가 정해지면 name만 바꾸세요.
  const ZONES = [
    { name: '구역 A', x: -2.84, z: -0.36, w: 1.13, d: 1.05, h: 0.3 },
    { name: '구역 B', x: -2.66, z: 1.21,  w: 1.33, d: 0.96, h: 0.3 }
  ];
  const ROOM = { x1: -3.5, x2: 2.2, z1: -2.5, z2: 2.7 };   // 방 바닥 윤곽(대략)
  let mapInited = false, mapScene, mapCamera, mapRenderer, mapControls, mapRaycaster, mapShelves = [], mapRafId = 0;
  let mapHighlightLoc = null;
  const locLabel = (rackId, levelIdx) => rackId + '-' + (levelIdx + 1);
  function mapStatusColor(loc) {
    const list = items.filter(i => i.location === loc);
    if (!list.length) return 0x8d99ae;        // 재고 없음 — 회색
    if (list.some(isOld)) return 0xe0a52c;    // 실사 필요 — 주황
    return 0x2dbb6a;                          // 정상 — 초록
  }
  function mapLabelSprite(text, scale) {
    const c = document.createElement('canvas'); c.width = 256; c.height = 128;
    const ctx = c.getContext('2d');
    ctx.font = 'bold 56px sans-serif'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,.65)'; ctx.shadowBlur = 10;
    ctx.fillText(text, 128, 64);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
    const s = scale || 1;
    sp.scale.set(0.9 * s, 0.45 * s, 1);
    return sp;
  }
  function buildMapScene() {
    const wrap = $('#mapCanvasWrap');
    const w = Math.max(1, wrap.clientWidth), h = Math.max(1, wrap.clientHeight);
    mapScene = new THREE.Scene();
    mapCamera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
    mapCamera.position.set(-3.2, 6.2, 7.2);   // 왼쪽 앞 위에서 내려다봄 → 네 랙 앞면이 모두 보임
    mapRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    mapRenderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    mapRenderer.setSize(w, h);
    wrap.innerHTML = ''; wrap.appendChild(mapRenderer.domElement);

    mapScene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dl = new THREE.DirectionalLight(0xffffff, 0.9); dl.position.set(-4, 7, 5); mapScene.add(dl);
    const dl2 = new THREE.DirectionalLight(0xffffff, 0.3); dl2.position.set(4, 2, -3); mapScene.add(dl2);

    const grid = new THREE.GridHelper(14, 28, 0x5b73ff, 0x3a4256);
    grid.material.transparent = true; grid.material.opacity = 0.18; mapScene.add(grid);

    // 방 바닥 윤곽선
    const outline = new THREE.LineLoop(
      new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(ROOM.x1, 0.01, ROOM.z1), new THREE.Vector3(ROOM.x2, 0.01, ROOM.z1),
        new THREE.Vector3(ROOM.x2, 0.01, ROOM.z2), new THREE.Vector3(ROOM.x1, 0.01, ROOM.z2)
      ]),
      new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.45 })
    );
    mapScene.add(outline);

    mapShelves = [];
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x2b3245, metalness: 0.4, roughness: 0.5 });
    RACKS.forEach(rack => {
      const heightM = rack.feet * 0.3048;
      const levelH = heightM / rack.levels;
      const L = rack.len, D = RACK_DEPTH;
      // 랙 하나를 그룹으로 만들어(앞면 = 로컬 +z) 위치·방향만 돌려 놓음
      const g = new THREE.Group();
      g.position.set(rack.x, 0, rack.z);
      g.rotation.y = rack.face === 'left' ? -Math.PI / 2 : 0;
      // 기둥: 양 끝 + 약 1.2m마다 중간 기둥
      const bays = Math.max(1, Math.round(L / 1.2));
      for (let b = 0; b <= bays; b++) {
        const px = -L / 2 + (L * b) / bays;
        [-1, 1].forEach(sz => {
          const post = new THREE.Mesh(new THREE.BoxGeometry(0.04, heightM, 0.04), frameMat);
          post.position.set(px, heightM / 2, sz * D / 2);
          g.add(post);
        });
      }
      for (let lv = 0; lv < rack.levels; lv++) {
        const loc = locLabel(rack.id, lv);
        const y = heightM - levelH * (lv + 0.5);   // 위에서부터 1번(1-1)
        const glassMat = new THREE.MeshPhysicalMaterial({
          color: mapStatusColor(loc), transparent: true, opacity: 0.48, roughness: 0.15, metalness: 0.05, clearcoat: 0.5,
          emissive: 0xffe066, emissiveIntensity: 0
        });
        const box = new THREE.Mesh(new THREE.BoxGeometry(L - 0.08, levelH - 0.06, D - 0.08), glassMat);
        box.position.set(0, y, 0);
        box.userData = { loc };
        g.add(box);
        mapShelves.push(box);
        const plate = new THREE.Mesh(new THREE.BoxGeometry(L, 0.02, D), frameMat);
        plate.position.set(0, y - levelH / 2, 0);
        g.add(plate);
        const label = mapLabelSprite(loc);
        label.position.set(0, y, D / 2 + 0.3);
        g.add(label);
      }
      // 랙 번호(꼭대기)
      const head = mapLabelSprite('랙 ' + rack.id, 1.3);
      head.position.set(0, heightM + 0.35, 0);
      g.add(head);
      mapScene.add(g);
    });

    // 번호 없는 구역
    const zoneMat = new THREE.MeshStandardMaterial({ color: 0x8d99ae, transparent: true, opacity: 0.3, roughness: 0.8 });
    ZONES.forEach(z => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(z.w, z.h, z.d), zoneMat);
      m.position.set(z.x, z.h / 2, z.z);
      mapScene.add(m);
      const edge = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),
        new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 }));
      edge.position.copy(m.position);
      mapScene.add(edge);
      const lb = mapLabelSprite(z.name);
      lb.position.set(z.x, z.h + 0.35, z.z);
      mapScene.add(lb);
    });

    mapControls = new THREE.OrbitControls(mapCamera, mapRenderer.domElement);
    mapControls.enableDamping = true; mapControls.dampingFactor = 0.08;
    mapControls.minDistance = 1.5; mapControls.maxDistance = 18;
    mapControls.maxPolarAngle = Math.PI / 2 - 0.05;   // 바닥 아래로 돌아가지 않게
    mapControls.target.set(-0.4, 0.6, 0.1);
    mapControls.update();

    mapRaycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    function pick(e, isClick) {
      const rect = mapRenderer.domElement.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX, cy = e.touches ? e.touches[0].clientY : e.clientY;
      pointer.x = ((cx - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((cy - rect.top) / rect.height) * 2 + 1;
      mapRaycaster.setFromCamera(pointer, mapCamera);
      const hits = mapRaycaster.intersectObjects(mapShelves);
      const tip = $('#mapTip');
      if (hits.length) {
        const loc = hits[0].object.userData.loc;
        if (isClick) { goToLocation(loc); return; }
        tip.textContent = `${loc} · 품목 ${items.filter(i => i.location === loc).length}개`;
        tip.style.left = (cx - rect.left) + 'px'; tip.style.top = (cy - rect.top) + 'px';
        tip.classList.add('on');
      } else tip.classList.remove('on');
    }
    mapRenderer.domElement.addEventListener('mousemove', e => pick(e, false));
    // 회전/드래그 끝에 손이 움직인 채로 클릭이 발생해 선반이 잘못 선택되는 것을 막음
    let downX = 0, downY = 0;
    mapRenderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
    mapRenderer.domElement.addEventListener('click', e => {
      if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
      pick(e, true);
    });

    (function animate() {
      mapRafId = requestAnimationFrame(animate);
      if ($('#mapModal').hidden) return;   // 닫혀 있을 때는 그리지 않음(배터리 절약)
      if (mapHighlightLoc) {
        const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 220);
        mapShelves.forEach(box => {
          box.material.emissiveIntensity = box.userData.loc === mapHighlightLoc ? pulse : 0;
        });
      } else {
        mapShelves.forEach(box => { if (box.material.emissiveIntensity) box.material.emissiveIntensity = 0; });
      }
      mapControls.update();
      mapRenderer.render(mapScene, mapCamera);
    })();
  }
  function goToLocation(loc) {
    filter.loc = loc; openId = null;
    closeMap();
    setTab('stock');
    renderChips(); render();
    toast('선반 ' + loc + ' 재고만 보여줍니다.');
  }
  function onMapResize() {
    if (!mapRenderer) return;
    const wrap = $('#mapCanvasWrap'), w = Math.max(1, wrap.clientWidth), h = Math.max(1, wrap.clientHeight);
    mapCamera.aspect = w / h; mapCamera.updateProjectionMatrix();
    mapRenderer.setSize(w, h);
  }
  window.addEventListener('resize', onMapResize);
  function openMap() {
    if (typeof THREE === 'undefined' || !THREE.OrbitControls) { toast('3D 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.', true); return; }
    // 아이템을 클릭해 열어 둔 상태에서 맵을 열면, 그 아이템이 있는 선반이 빛남
    const openedItem = openId ? items.find(i => i.rid === openId) : null;
    mapHighlightLoc = (openedItem && openedItem.location) || null;
    $('#mapModal').hidden = false;
    if (!mapInited) { mapInited = true; try { buildMapScene(); } catch (e) { toast('맵을 그리지 못했습니다: ' + e.message, true); } }
    else mapShelves.forEach(box => box.material.color.setHex(mapStatusColor(box.userData.loc)));
    if (mapHighlightLoc) {
      const target = mapShelves.find(b => b.userData.loc === mapHighlightLoc);
      if (target) {
        if (mapControls) target.getWorldPosition(mapControls.target);
        toast('선반 ' + mapHighlightLoc + ' 위치가 맵에서 빛나고 있어요.');
      }
    }
    setTimeout(onMapResize, 0);
  }
  function closeMap() { $('#mapModal').hidden = true; }
  $('#mapBtn').addEventListener('click', openMap);
  $('#mapClose').addEventListener('click', closeMap);
  $('#mapModal').addEventListener('click', e => { if (e.target.id === 'mapModal') closeMap(); });

  /* ---------- 시작: 주소에 ?loc=1-4 가 있으면 그 선반만 ---------- */
  function applyParams(p) { if (p && p.loc) filter.loc = String(p.loc); if (user) start(); else showGate(); }
  if (IS_GAS && google.script.url) google.script.url.getLocation(l => applyParams(l.parameter || {}));
  else applyParams(Object.fromEntries(new URLSearchParams(location.search)));

</script>
</body>
</html>
